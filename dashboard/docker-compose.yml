# From repo root (recommended — picks up repo-root .env for build args):
#   docker compose --env-file .env -f dashboard/docker-compose.yml build --no-cache api
#   docker compose --env-file .env -f dashboard/docker-compose.yml up -d
#
# If you run from `dashboard/`, Compose only auto-reads `dashboard/.env` for variable substitution,
# not `env_file: ../.env` (that only affects the running container). Use:
#   docker compose --env-file ../.env build --no-cache api && docker compose --env-file ../.env up -d
#
# Content rewrite needs the **Claude Code** native CLI in the api image when INSTALL_CLAUDE_CODE=1
# (see root .env), or bind-mount the host binary and set CLAUDE_CODE_EXECUTABLE.
services:
  api:
    build:
      context: ./backend
      args:
        INSTALL_CLAUDE_CODE: ${INSTALL_CLAUDE_CODE:-0}
    env_file:
      - ../.env
    environment:
      DASHBOARD_API_HOST: 0.0.0.0
      NANOCLAW_DATA_DIR: /nanoclaw/data
      NANOCLAW_LOG_PATH: /nanoclaw/logs/nanoclaw.log
      NANOCLAW_GROUPS_DIR: /nanoclaw/groups
      DASHBOARD_SQLITE_PATH: /dashboard/data/app.sqlite
    volumes:
      - ../data:/nanoclaw/data:ro
      - ../logs:/nanoclaw/logs:ro
      - ../groups:/nanoclaw/groups:ro
      # Bind mount: SQLite and other dashboard state live on the host at dashboard/data/
      # (survives container recreate, compose down, and matches DASHBOARD_SQLITE_PATH in .env).
      - ./data:/dashboard/data
    ports:
      - "3002:3002"

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "8080:80"
